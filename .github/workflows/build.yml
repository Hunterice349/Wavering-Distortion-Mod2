
name: Build Wavering Distortion Mod

on:
  push:
    branches:
      - main
      - fix/ci-build-main-trigger
      - fix/restore-stable-baseline

  pull_request:
    branches:
      - main
      - fix/restore-stable-baseline

  workflow_dispatch:

jobs:
  build:
    name: Build VST3 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin and tests
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Run DSP tests
        run: |
          ctest --test-dir build \
            -C Release \
            --output-on-failure

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wavering-Distortion-${{ matrix.os }}-VST3
          path: build/WaveringDistortionMod_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
