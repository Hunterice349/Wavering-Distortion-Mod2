
name: Build Wavering Distortion Mod

on:
  push:
    branches:
      - "fix/restore-stable-baseline"
      - "feature/premium-vu-footswitch"
      - "fix/ci-build-main-trigger"

  pull_request:
    branches:
      - "fix/restore-stable-baseline"

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        include:
          - os: ubuntu-24.04
            cmake-build-type: Release
            artifact-name: Linux-VST3
          - os: windows-latest
            cmake-build-type: Release
            artifact-name: Windows-VST3
          - os: macos-latest
            cmake-build-type: Release
            artifact-name: macOS-VST3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libjack-jackd2-dev \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.0-dev \
          libglu1-mesa-dev \
          mesa-common-dev

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} -DJUCE_COPY_PLUGIN_AFTER_BUILD=ON

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.cmake-build-type }} --parallel

    - name: Run DSP Tests
      run: |
        ctest --test-dir build -C ${{ matrix.cmake-build-type }} --output-on-failure

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          build/WaveringDistortionMod_artefacts/Release/VST3/*.vst3
          build/WaveringDistortionMod_artefacts/Release/Standalone/*.exe
          build/WaveringDistortionMod_artefacts/Release/Standalone/*.app
