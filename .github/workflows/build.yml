name: Wavering Distortion Mod - Stable Build

on:
  push:
    branches:
      - main
      - fix/ci-build-main-trigger
      - fix/restore-stable-baseline
      - feature/premium-dsp-development

  pull_request:
    branches:
      - main
      - fix/restore-stable-baseline
      - feature/premium-dsp-development

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wavering-distortion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VST3 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build --config Release --parallel 2

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify VST3 bundle
        shell: bash
        run: |
          set -eu

          VST3_PATH="$(find build/WaveringDistortionMod_artefacts \
            -name '*.vst3' -print -quit)"

          if [ -z "$VST3_PATH" ]; then
            echo "ERROR: VST3 bundle was not generated."
            echo "Build output:"
            find build -maxdepth 7 -print | head -200
            exit 1
          fi

          echo "VST3 successfully generated:"
          echo "$VST3_PATH"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wavering-Distortion-${{ matrix.os }}-VST3
          path: build/WaveringDistortionMod_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
          retention-days: 14
